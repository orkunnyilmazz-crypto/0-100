<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0-100 Ölçer</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #15191f;
    --text: #f2f4f7;
    --muted: #8a93a0;
    --accent: #e82127;
    --ok: #2ecc71;
    --warn: #f1c40f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    user-select: none;
  }
  h1 { font-size: 22px; font-weight: 600; color: var(--muted); letter-spacing: 1px; }
  .status {
    margin-top: 18px;
    font-size: 28px;
    font-weight: 700;
    padding: 10px 28px;
    border-radius: 40px;
    background: var(--panel);
  }
  .status.ready { color: var(--ok); }
  .status.running { color: var(--warn); }
  .status.done { color: var(--accent); }
  .speed {
    font-size: clamp(90px, 22vw, 200px);
    font-weight: 800;
    line-height: 1;
    margin-top: 24px;
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 26px; color: var(--muted); }
  .timer {
    font-size: clamp(56px, 12vw, 110px);
    font-weight: 700;
    margin-top: 24px;
    font-variant-numeric: tabular-nums;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 720px;
    margin-top: 28px;
  }
  .card {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .card .label { font-size: 14px; color: var(--muted); }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .buttons { display: flex; gap: 14px; margin-top: 28px; flex-wrap: wrap; justify-content: center; }
  button {
    font-size: 24px;
    font-weight: 700;
    padding: 18px 44px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
  }
  button.secondary { background: #2b313a; }
  .note { margin-top: 22px; font-size: 14px; color: var(--muted); text-align: center; max-width: 600px; }
  .error { color: var(--accent); }
</style>
</head>
<body>
  <h1>0 – 100 KM/S ÖLÇER</h1>
  <div id="status" class="status">Başlamak için butona bas</div>

  <div class="speed"><span id="speed">0</span> <span class="unit">km/s</span></div>
  <div class="timer" id="timer">0.00 sn</div>

  <div class="grid">
    <div class="card"><div class="label">Son Süre</div><div class="value" id="last">–</div></div>
    <div class="card"><div class="label">En İyi Süre</div><div class="value" id="best">–</div></div>
    <div class="card"><div class="label">GPS Doğruluk</div><div class="value" id="acc">–</div></div>
  </div>

  <div class="buttons">
    <button id="startBtn">Başlat</button>
    <button id="resetBtn" class="secondary">Sıfırla</button>
  </div>

  <p class="note" id="note">GPS saniyede yaklaşık 1 kez güncellenir, sonuç yaklaşık bir değerdir. Sadece güvenli ve kapalı bir alanda dene.</p>

<script>
  const TARGET = 100;     // hedef hız (km/s)
  const STOP_LIMIT = 1;   // bu hızın altı "durdu" sayılır
  const START_LIMIT = 2;  // bu hızın üstü "kalkış" sayılır

  const el = id => document.getElementById(id);
  let watchId = null;
  let state = 'idle';     // idle | waiting | ready | running | done
  let startTime = null;
  let lastSample = null;  // {t, v}
  let prevPos = null;
  let timerLoop = null;
  let wakeLock = null;

  function setStatus(text, cls) {
    const s = el('status');
    s.textContent = text;
    s.className = 'status' + (cls ? ' ' + cls : '');
  }

  function fmt(sec) { return sec.toFixed(2) + ' sn'; }

  function loadBest() {
    try {
      const b = localStorage.getItem('best0100');
      if (b) el('best').textContent = fmt(parseFloat(b));
    } catch (e) {}
  }

  function saveBest(sec) {
    try {
      const b = parseFloat(localStorage.getItem('best0100'));
      if (isNaN(b) || sec < b) {
        localStorage.setItem('best0100', sec);
        el('best').textContent = fmt(sec);
      }
    } catch (e) {}
  }

  // İki nokta arası mesafe (metre)
  function distance(a, b) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.latitude - a.latitude) * rad;
    const dLon = (b.longitude - a.longitude) * rad;
    const x = Math.sin(dLat / 2) ** 2 +
      Math.cos(a.latitude * rad) * Math.cos(b.latitude * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }

  function getSpeedKmh(pos) {
    // Önce cihazın verdiği hızı kullan, yoksa konum farkından hesapla
    if (pos.coords.speed !== null && !isNaN(pos.coords.speed)) {
      return Math.max(0, pos.coords.speed * 3.6);
    }
    if (prevPos) {
      const dt = (pos.timestamp - prevPos.timestamp) / 1000;
      if (dt > 0) return (distance(prevPos.coords, pos.coords) / dt) * 3.6;
    }
    return 0;
  }

  function onPosition(pos) {
    const v = getSpeedKmh(pos);
    const t = pos.timestamp;
    prevPos = pos;

    el('speed').textContent = Math.round(v);
    el('acc').textContent = Math.round(pos.coords.accuracy) + ' m';

    if (state === 'waiting' && v < STOP_LIMIT) {
      state = 'ready';
      setStatus('Hazır! Gaza bas', 'ready');
    } else if (state === 'ready') {
      if (v >= START_LIMIT) {
        // Kalkış anını son "durgun" örnekle bu örnek arasında tahmin et
        if (lastSample && lastSample.v < START_LIMIT) {
          const ratio = (START_LIMIT - lastSample.v) / (v - lastSample.v);
          startTime = lastSample.t + ratio * (t - lastSample.t);
        } else {
          startTime = t;
        }
        state = 'running';
        setStatus('Ölçülüyor...', 'running');
        startTimer();
      }
    } else if (state === 'running') {
      if (v >= TARGET) {
        // 100'e tam ulaşma anını iki örnek arasında doğrusal olarak tahmin et
        let endTime = t;
        if (lastSample && lastSample.v < TARGET && v > lastSample.v) {
          const ratio = (TARGET - lastSample.v) / (v - lastSample.v);
          endTime = lastSample.t + ratio * (t - lastSample.t);
        }
        finish((endTime - startTime) / 1000);
      } else if (v < STOP_LIMIT) {
        // Araç tekrar durduysa ölçümü iptal et
        stopTimer();
        el('timer').textContent = fmt(0);
        state = 'ready';
        setStatus('Durdun. Tekrar hazır', 'ready');
      }
    }
    lastSample = { t, v };
  }

  function startTimer() {
    stopTimer();
    timerLoop = setInterval(() => {
      if (startTime) el('timer').textContent = fmt((Date.now() - startTime) / 1000);
    }, 50);
  }

  function stopTimer() {
    if (timerLoop) clearInterval(timerLoop);
    timerLoop = null;
  }

  function finish(sec) {
    stopTimer();
    state = 'done';
    el('timer').textContent = fmt(sec);
    el('last').textContent = fmt(sec);
    saveBest(sec);
    setStatus('Bitti! Yeni deneme için dur', 'done');
    // Araç durunca otomatik yeniden hazır ol
    setTimeout(() => { if (state === 'done') state = 'waiting'; }, 1500);
  }

  function onError(err) {
    const msgs = {
      1: 'Konum izni verilmedi. Tarayıcı ayarlarından izin ver.',
      2: 'Konum alınamıyor. GPS sinyalini kontrol et.',
      3: 'Konum isteği zaman aşımına uğradı.'
    };
    setStatus('Hata', 'done');
    el('note').innerHTML = '<span class="error">' + (msgs[err.code] || err.message) + '</span>';
  }

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) {}
  }

  el('startBtn').addEventListener('click', () => {
    if (!('geolocation' in navigator)) {
      setStatus('Bu tarayıcı GPS desteklemiyor', 'done');
      return;
    }
    if (watchId === null) {
      watchId = navigator.geolocation.watchPosition(onPosition, onError, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      });
      keepAwake();
    }
    state = 'waiting';
    setStatus('Aracı durdur...', '');
    el('startBtn').textContent = 'Yeniden Başlat';
  });

  el('resetBtn').addEventListener('click', () => {
    stopTimer();
    startTime = null;
    lastSample = null;
    el('timer').textContent = fmt(0);
    el('last').textContent = '–';
    el('best').textContent = '–';
    try { localStorage.removeItem('best0100'); } catch (e) {}
    if (watchId !== null) {
      state = 'waiting';
      setStatus('Aracı durdur...', '');
    } else {
      state = 'idle';
      setStatus('Başlamak için butona bas', '');
    }
  });

  loadBest();
</script>
</body>
</html>
